# Ejemplos de anotación POS en Guaraní para guiar a OpenAI
# IMPORTANTE: Usar SOLO las etiquetas en español (SUJETO, VERBO, SUSTANTIVO, etc.)

- text: "Che ahasa escuela-pe"
  spans:
    - start: 0
      end: 3
      label: "PRONOMBRE"      # Pronombre personal: yo
    - start: 4
      end: 9
      label: "VERBO"          # Verbo: voy/paso
    - start: 10
      end: 17
      label: "SUSTANTIVO"     # Sustantivo: escuela
    - start: 17
      end: 20
      label: "PREPOSICIÓN"    # Posposición locativa: -pe (a/en)

- text: "Itaugua-pe omokyre'ÿ mitãnguéra"
  spans:
    - start: 0
      end: 7
      label: "SUSTANTIVO"     # Lugar: Itauguá
    - start: 7
      end: 10
      label: "PREPOSICIÓN"    # Posposición: -pe (en)
    - start: 11
      end: 20
      label: "VERBO"          # Verbo: promueven
    - start: 21
      end: 31
      label: "SUSTANTIVO"     # Sustantivo: niños

- text: "Ko'ã tapicha político-icha omba'apo"
  spans:
    - start: 0
      end: 4
      label: "ARTÍCULO"       # Determinante: estos
    - start: 5
      end: 12
      label: "SUSTANTIVO"     # Sustantivo: personas
    - start: 13
      end: 21
      label: "ADJETIVO"       # Adjetivo: político
    - start: 21
      end: 26
      label: "PREPOSICIÓN"    # Sufijo: -icha (como)
    - start: 27
      end: 35
      label: "VERBO"          # Verbo: trabajan

- text: "Che sy ha che ru"
  spans:
    - start: 0
      end: 3
      label: "PRONOMBRE"      # Pronombre posesivo: mi
    - start: 4
      end: 6
      label: "SUSTANTIVO"     # Sustantivo: madre
    - start: 7
      end: 9
      label: "CONJUNCIÓN"     # Conjunción: y
    - start: 10
      end: 13
      label: "PRONOMBRE"      # Pronombre posesivo: mi
    - start: 14
      end: 16
      label: "SUSTANTIVO"     # Sustantivo: padre

- text: "Hikuái oho mercado-pe"
  spans:
    - start: 0
      end: 6
      label: "PRONOMBRE"      # Pronombre: ellos
    - start: 7
      end: 10
      label: "VERBO"          # Verbo: van
    - start: 11
      end: 18
      label: "SUSTANTIVO"     # Sustantivo: mercado
    - start: 18
      end: 21
      label: "PREPOSICIÓN"    # Posposición: -pe (a)
